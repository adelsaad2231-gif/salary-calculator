<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة المرتب</title>
<style>
:root{--p:#1565C0;--p2:#E3F0FF;--bg:#F2F5FA;--t:#1B2430;--m:#6B7686;--r:#E65100;--g:#2E7D32;--o:#EF6C00;--card:#fff;--bd:#D5DCE8}
[data-theme=dark]{--p2:#1B2A44;--bg:#0D1017;--t:#E8ECF3;--m:#8B94A6;--card:#161B26;--bd:#262C38;--g:#4ADE80;--r:#FB8C00}
[data-theme=dark] .sum .net,[data-theme=dark] .card h2,[data-theme=dark] .c-lv{color:#5B9DFF}
[data-theme=dark] .btn.s{color:#5B9DFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:40px}
header{background:var(--p);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px;margin:0}
header button{background:#ffffff33;color:#fff;border:0;border-radius:20px;padding:6px 14px;font-size:14px}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.card h2{font-size:15px;margin:0 0 10px;color:var(--p)}
label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--card);color:var(--t)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:11px;font-size:15px;width:100%;margin-top:10px}
.btn.s{background:var(--p2);color:var(--p)}
.btn.d{background:linear-gradient(135deg,#FFA726,#F57C00);color:#fff}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:13px;color:var(--t)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum .net{border-top:2px solid var(--p2);margin-top:6px;padding-top:10px;font-weight:700;font-size:18px;color:var(--p)}
.pos{color:var(--g)}.neg{color:var(--r)}
.day{border-top:1px solid var(--bd);padding:8px 0}
.day:first-child{border-top:0}
.dh{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.it{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--m);padding:3px 0}
.it button{border:0;background:none;color:var(--r);font-size:18px}
.chip{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;margin-inline-end:6px}
.c-ot{background:#2E7D3226;color:var(--g)}.c-ded{background:color-mix(in srgb,var(--r) 14%,transparent);color:var(--r)}.c-lv{background:var(--p2);color:var(--p)}
.nav{display:flex;gap:0;background:var(--p);padding:0 12px 10px}.nav button{flex:1;border:0;background:#ffffff26;color:#fff;padding:10px;font-size:15px;font-weight:600}.nav button:first-child{border-radius:12px 0 0 12px}.nav button:last-child{border-radius:0 12px 12px 0}[dir=rtl] .nav button:first-child{border-radius:0 12px 12px 0}[dir=rtl] .nav button:last-child{border-radius:12px 0 0 12px}.nav button.on{background:#fff;color:var(--p)}
.small{font-size:12px;color:var(--m)}
#msg{font-size:12px;color:var(--m);margin-top:6px;min-height:16px}
.hbtns{display:flex;gap:6px;align-items:center}.hbtns .ic{border-radius:50%;padding:5px 9px;font-size:13px;line-height:1.2}.hbtns .ic.on{background:#fff}

header,.nav{background:linear-gradient(135deg,#0D47A1,#1E88E5 60%,#42A5F5)!important}.btn:not(.s):not(.d),.tabs button.on{background:linear-gradient(135deg,#0D47A1,#1E88E5 60%,#42A5F5)!important;border-color:transparent}.nav button.on{background:#fff}
body{background:linear-gradient(180deg,#EAF2FF,#F7F9FC 40%) fixed,var(--bg)!important;min-height:100vh}[data-theme=dark] body{background:linear-gradient(180deg,#0A1224,#0D1017 45%) fixed,var(--bg)!important}
.sum{background:linear-gradient(135deg,var(--card),var(--p2))!important}.btn.d{background:linear-gradient(135deg,#FFA726,#E65100)!important}.card{box-shadow:0 2px 10px #1565C022}

.nav button{padding:10px 4px}
.ring{display:flex;align-items:center;gap:16px}.ring svg{flex:none}.ring .lt{flex:1}.ring .lt div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.bar{height:8px;border-radius:8px;background:var(--p2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0D47A1,#42A5F5)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--m);margin-top:6px;justify-content:center}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.mrow:first-of-type{border-top:0}
.mrow .mn{font-weight:700;font-size:14px}.mrow .ms{font-size:11px;color:var(--m);margin-top:2px}.mrow .mv{text-align:end}.mrow .mv b{font-size:15px;color:var(--p)}[data-theme=dark] .mrow .mv b{color:#5B9DFF}
.mrow .mv div{font-size:11px;margin-top:2px}
[data-theme=dark] header,[data-theme=dark] .nav{background:linear-gradient(135deg,#061A3D,#0B3068 60%,#10498F)!important}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><div class="hbtns"><button class="ic" id="thL" title="Light">☀️</button><button class="ic" id="thD" title="Dark">🌙</button><button id="lang"></button></div></header>
<nav class="nav"><button id="nMain"></button><button id="nArc"></button><button id="nSet"></button></nav>
<main>
<section id="pMain">
<div class="card">
  <label id="l_month"></label><input type="month" id="month">
  <div class="small" id="period" style="margin-top:6px"></div>
  <label id="l_bonus"></label><input type="number" id="bonus" inputmode="decimal" placeholder="0">
</div>
<div class="card">
  <h2 id="h_add"></h2>
  <label id="l_date"></label><input type="date" id="date">
  <div class="tabs" id="tabs" style="margin-top:10px"></div>
  <div id="form"></div>
  <button class="btn" id="add"></button>
  <div id="msg"></div>
</div>
<div class="card"><h2 id="h_days"></h2><div id="days"></div></div>
<div class="card sum" id="sum"></div>
<div class="card"><h2 id="h_leave"></h2><div id="leave"></div></div>
</section>
<section id="pArc" style="display:none">
<div class="card"><h2 id="h_lvc"></h2><div id="lvc"></div></div>
<div class="card"><h2 id="h_chart"></h2><div id="chart"></div></div>
<div class="card"><h2 id="h_arc"></h2><div id="arc"></div></div>
</section>
<section id="pSet" style="display:none">
<div class="card">
  <h2 id="h_set"></h2>
  <label id="l_sal"></label><input type="number" id="salary" inputmode="decimal">
  <label id="l_fix"></label><input type="number" id="fixb" inputmode="decimal">
  <div class="row"><div><label id="l_dpm"></label><input type="number" id="dpm"></div><div><label id="l_hpd"></label><input type="number" id="hpd"></div></div>
  <div class="row"><div><label id="l_sd"></label><input type="number" id="sd" min="1" max="28"></div><div><label id="l_bal"></label><input type="number" id="bal"></div></div>
  <div class="small" id="basehint" style="margin-top:8px"></div>
  <label id="l_url"></label><input type="url" id="url" placeholder="https://script.google.com/macros/s/.../exec" dir="ltr">
</div>
<div class="card">
  <button class="btn s" id="sync"></button>
  <button class="btn s" id="pull"></button>
  <button class="btn d" id="clr"></button>
  <button class="btn d" id="clrl"></button>
  <div id="msg2" class="small" style="margin-top:6px"></div>
</div>
</section>
</main>
<script>
const T={
ar:{ttl:"حاسبة المرتب",lang:"English",month:"الشهر",sal:"المرتب الشهري",nMain:"الرئيسية",nSet:"الإعدادات",bonus:"بونص يدوي (المبلغ)",fix:"بونص ثابت (يضاف على المرتب)",fixl:"البونص الثابت",manb:"بونص يدوي",sd:"يوم بداية الشهر",base:"الأساس للحساب",period:"الفترة",basehint:"الأساس للحساب = المرتب = ",basic:"الأساس",sum:"ملخص الشهر",hr:"سعر الساعة",ot:"الإضافي",ded:"الخصومات",net:"صافي المرتب",add:"إضافة سجل ليوم",date:"التاريخ",
tOt:"إضافي",tDed:"خصم",tLv:"إجازة",hours:"عدد الساعات",mult:"المعامل",half:"نصف يوم",full:"يوم كامل",count:"العدد",days:"أيام الشهر",none:"لا توجد سجلات",
lv:"Annual",bal:"الرصيد",used:"المستخدم",rem:"المتبقي",set:"الإعدادات",dpm:"أيام الشهر",hpd:"ساعات اليوم",url:"رابط Google Sheets (Apps Script)",
sync:"مزامنة كل السجلات مع Sheets",pull:"سحب السجلات من Sheets",pulled:"تم السحب من Sheets",pullerr:"تعذر السحب، راجع الرابط",clr:"مسح إضافي وخصومات الشهر",clrl:"مسح سجل الإجازات",sure:"اضغط تاني للتأكيد",added:"تمت الإضافة",synced:"تم الإرسال لـ Sheets",nourl:"حط رابط Sheets في الإعدادات الأول",
cur:"ج",d:"يوم",dayTot:"إجمالي اليوم",nArc:"الأرشيف",arc:"الشهور السابقة",chart:"الإضافي والخصومات",lvc:"عداد الإجازات السنوية",of:"من",nodata:"لا توجد بيانات",nodate:"اختار التاريخ",nohrs:"ادخل الساعات"},
en:{ttl:"Salary Calculator",lang:"عربي",month:"Month",sal:"Monthly salary",nMain:"Main",nSet:"Settings",bonus:"Manual bonus (amount)",fix:"Fixed bonus (added on top of salary)",fixl:"Fixed bonus",manb:"Manual bonus",sd:"Month start day",base:"Calculation base",period:"Period",basehint:"Calculation base = salary = ",basic:"Base",sum:"Month summary",hr:"Hourly rate",ot:"Overtime",ded:"Deductions",net:"Net salary",add:"Add a day entry",date:"Date",
tOt:"Overtime",tDed:"Deduction",tLv:"Leave",hours:"Hours",mult:"Multiplier",half:"Half day",full:"Full day",count:"Count",days:"Days of the month",none:"No entries",
lv:"Annual",bal:"Balance",used:"Used",rem:"Remaining",set:"Settings",dpm:"Days per month",hpd:"Hours per day",url:"Google Sheets link (Apps Script)",
sync:"Sync all entries to Sheets",pull:"Load entries from Sheets",pulled:"Loaded from Sheets",pullerr:"Could not load, check the link",clr:"Clear month overtime & deductions",clrl:"Clear leave log",sure:"Tap again to confirm",added:"Added",synced:"Sent to Sheets",nourl:"Set the Sheets link in Settings first",
cur:"EGP",d:"d",dayTot:"Day total",nArc:"Archive",arc:"Past months",chart:"Overtime & deductions",lvc:"Annual leave counter",of:"of",nodata:"No data",nodate:"Pick a date",nohrs:"Enter hours"}};
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem("salary_v2")||"null")||{lang:"ar",salary:"",dpm:26,hpd:8,bal:15,url:"",entries:[]};S=Object.assign({fixb:500,sd:26,bonuses:{},theme:"light"},S);S.bonuses=S.bonuses||{};
let type="ot";
const save=()=>localStorage.setItem("salary_v2",JSON.stringify(S));
const t=k=>T[S.lang][k];
const f=n=>n.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=new Date();const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sdv=()=>Math.min(28,Math.max(1,+S.sd||26));
function periodOf(m){const[y,mo]=m.split("-").map(Number);const s=new Date(y,mo-1,sdv()),e=new Date(y,mo,sdv()-1);return{s:iso(s),e:iso(e)}}
const defM=today.getDate()>=sdv()?new Date(today.getFullYear(),today.getMonth(),1):new Date(today.getFullYear(),today.getMonth()-1,1);
$("month").value=`${defM.getFullYear()}-${pad(defM.getMonth()+1)}`;
$("date").value=iso(today);
let page="main";
$("month").onchange=()=>{const m=$("month").value;if(m)$("date").value=periodOf(m).s;render()};
const inP=(e,p)=>e.date>=p.s&&e.date<=p.e;
function calc(mm){
  const sal=+S.salary||0,fix=+S.fixb||0,base=sal,dayR=base/S.dpm,hr=dayR/S.hpd,m=mm||$("month").value,p=periodOf(m);
  let ot=0,ded=0;
  S.entries.filter(e=>inP(e,p)).forEach(e=>{
    if(e.type=="ot")ot+=hr*e.hours*e.mult;
    if(e.type=="ded")ded+=dayR*e.days*e.count;
  });
  const man=+S.bonuses[m]||0;
  return{sal,fix,base,man,dayR,hr,ot,ded,net:base+ot-ded+fix+man,p,m};
}
function val(e,c){return e.type=="ot"?c.hr*e.hours*e.mult:e.type=="ded"?-c.dayR*e.days*e.count:0}
function render(){
  const L=S.lang;document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
  $("ttl").textContent=t("ttl");$("lang").textContent=t("lang");
  $("l_month").textContent=t("month");$("l_sal").textContent=t("sal");$("h_add").textContent=t("add");$("l_date").textContent=t("date");
  $("h_days").textContent=t("days");$("h_leave").textContent=t("lv");$("h_set").textContent=t("set");
  $("nMain").textContent=t("nMain");$("nSet").textContent=t("nSet");$("nMain").className=page=="main"?"on":"";$("nSet").className=page=="set"?"on":"";$("pMain").style.display=page=="main"?"":"none";$("pSet").style.display=page=="set"?"":"none";$("pArc").style.display=page=="arc"?"":"none";$("nArc").className=page=="arc"?"on":"";$("nArc").textContent=t("nArc");$("h_lvc").textContent=t("lvc");$("h_chart").textContent=t("chart");$("h_arc").textContent=t("arc");$("l_bonus").textContent=t("bonus");$("l_fix").textContent=t("fix");$("l_sd").textContent=t("sd");
  $("l_dpm").textContent=t("dpm");$("l_hpd").textContent=t("hpd");$("l_bal").textContent=t("bal");$("l_url").textContent=t("url");
  $("sync").textContent=t("sync");$("pull").textContent=t("pull");$("clr").textContent=t("clr");$("clrl").textContent=t("clrl");$("add").textContent=t("add");
  $("salary").value=S.salary;$("dpm").value=S.dpm;$("hpd").value=S.hpd;$("bal").value=S.bal;$("url").value=S.url;$("fixb").value=S.fixb;$("sd").value=S.sd;
  const c=calc(),cu=" "+t("cur");$("period").textContent=t("period")+": "+c.p.s+" → "+c.p.e;$("bonus").value=c.man||"";$("basehint").textContent=t("basehint")+f(c.base);
  $("sum").innerHTML=`<h2 style="margin:0 0 6px;font-size:15px;color:var(--p)">${t("sum")}</h2>
  <div><span>${t("basic")}</span><b>${f(c.base)}</b></div>
  <div><span>${t("fixl")}</span><b class="pos">+${f(c.fix)}</b></div>
  <div><span>${t("manb")}</span><b class="pos">+${f(c.man)}</b></div>
  <div><span>${t("hr")}</span><b>${f(c.hr)}</b></div>
  <div><span>${t("ot")}</span><b class="pos">+${f(c.ot)}</b></div>
  <div><span>${t("ded")}</span><b class="neg">-${f(c.ded)}</b></div>
  <div class="net"><span>${t("net")}</span><span>${f(c.net)}${cu}</span></div>`;
  // tabs
  $("tabs").innerHTML=[["ot","tOt"],["ded","tDed"],["lv","tLv"]].map(([k,n])=>`<button class="${type==k?"on":""}" data-k="${k}">${t(n)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{type=b.dataset.k;render()});
  let h="";
  if(type=="ot")h=`<div class="row"><div><label>${t("hours")}</label><input type="number" step="0.25" id="f_h" inputmode="decimal"></div><div><label>${t("mult")}</label><select id="f_m"><option value="1.5">x1.5</option><option value="2">x2</option></select></div></div>`;
  if(type=="ded")h=`<div class="row"><div><label>${t("tDed")}</label><select id="f_d"><option value="0.5">${t("half")}</option><option value="1">${t("full")}</option></select></div><div><label>${t("count")}</label><input type="number" id="f_c" value="1" min="1"></div></div>`;
  $("form").innerHTML=h;
  // days
  const es=S.entries.filter(e=>inP(e,c.p));
  const by={};es.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  const ds=Object.keys(by).sort();
  $("days").innerHTML=ds.length?ds.map(d=>{
    const tot=by[d].reduce((a,e)=>a+val(e,c),0);
    const items=by[d].map(e=>{
      let chip,txt;
      if(e.type=="ot"){chip=`<span class="chip c-ot">${t("tOt")}</span>`;txt=`${e.hours}h x${e.mult} = +${f(val(e,c))}`}
      else if(e.type=="ded"){chip=`<span class="chip c-ded">${t("tDed")}</span>`;txt=`${e.days==0.5?t("half"):t("full")} x${e.count} = ${f(val(e,c))}`}
      else{chip=`<span class="chip c-lv">${t("tLv")}</span>`;txt="1 "+t("d")}
      return `<div class="it"><span>${chip}${txt}</span><button data-id="${e.id}">×</button></div>`}).join("");
    return `<div class="day"><div class="dh"><span>${d}</span><span class="${tot>=0?"pos":"neg"}">${tot>=0?"+":""}${f(tot)}</span></div>${items}</div>`}).join(""):`<div class="small">${t("none")}</div>`;
  $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.entries=S.entries.filter(e=>e.id!=b.dataset.id);save();render();if(S.url)post([],{del:b.dataset.id})});
  const used=S.entries.filter(e=>e.type=="lv").length;
  const lh=leaveHTML(used);$("leave").innerHTML=lh;$("lvc").innerHTML=lh;renderArc();
}
function leaveHTML(used){
  const bal=+S.bal||0,rem=bal-used,pc=bal?Math.min(1,used/bal):0,R=40,C=2*Math.PI*R;
  return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D47A1"/><stop offset="1" stop-color="#42A5F5"/></linearGradient></defs><circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--p2)" stroke-width="10"/><circle cx="52" cy="52" r="${R}" fill="none" stroke="#2196F3" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}" transform="rotate(-90 52 52)"/><text x="52" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="var(--t)">${rem}</text><text x="52" y="72" text-anchor="middle" font-size="11" fill="var(--m)">${t("rem")}</text></svg><div class="lt"><div><span>${t("bal")}</span><b>${bal}</b></div><div><span>${t("used")}</span><b>${used}</b></div></div></div><div class="bar"><i style="width:${pc*100}%"></i></div><div class="small" style="margin-top:6px;text-align:center">${used} ${t("of")} ${bal} ${t("d")}</div>`}
function mkey(d){const[y,m,dd]=d.split("-").map(Number);const x=dd>=sdv()?new Date(y,m-1,1):new Date(y,m-2,1);return `${x.getFullYear()}-${pad(x.getMonth()+1)}`}
function renderArc(){
  const ks=new Set(S.entries.filter(e=>e.type!="lv").map(e=>mkey(e.date)));ks.add($("month").value);
  const ms=[...ks].sort().reverse();
  const data=ms.map(m=>({m,c:calc(m)}));
  const mn=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString(S.lang=="ar"?"ar-EG":"en",{month:"long",year:"numeric"})};
  $("arc").innerHTML=data.map(({m,c})=>`<div class="mrow"><div><div class="mn">${mn(m)}</div><div class="ms">${c.p.s} → ${c.p.e}</div></div><div class="mv"><b>${f(c.net)} ${t("cur")}</b><div><span class="pos">+${f(c.ot)}</span> &nbsp; <span class="neg">-${f(c.ded)}</span></div></div></div>`).join("");
  const cd=data.slice(0,6).reverse();const mx=Math.max(1,...cd.map(x=>Math.max(x.c.ot,x.c.ded)));
  const W=320,H=170,bw=16,g=(W-cd.length*bw*2)/(cd.length+1);let sv="";
  [0.25,0.5,0.75,1].forEach(q=>{const y=130-q*100;sv+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-dasharray="3 3"/>`});
  cd.forEach((x,i)=>{const x0=g+i*(2*bw+g),h1=x.c.ot/mx*100,h2=x.c.ded/mx*100;
    sv+=`<rect x="${x0}" y="${130-h1}" width="${bw}" height="${h1}" rx="4" fill="#2E7D32"/><rect x="${x0+bw+2}" y="${130-h2}" width="${bw}" height="${h2}" rx="4" fill="#E65100"/>`;
    sv+=`<text x="${x0+bw}" y="150" text-anchor="middle" font-size="11" fill="var(--m)">${x.m.slice(5)}</text><text x="${x0+bw}" y="165" text-anchor="middle" font-size="9" fill="var(--m)">${x.m.slice(0,4)}</text>`});
  $("chart").innerHTML=cd.length?`<svg viewBox="0 0 ${W} ${H}" width="100%">${sv}</svg><div class="legend"><span><b style="background:#2E7D32"></b>${t("ot")}</span><span><b style="background:#E65100"></b>${t("ded")}</span></div>`:`<div class="small">${t("nodata")}</div>`;
}
function post(rows,extra){
  if(!S.url){($("msg").textContent=$("msg2").textContent=t("nourl"));return Promise.resolve(false)}
  return fetch(S.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({rows},extra||{}))}).then(()=>{($("msg").textContent=$("msg2").textContent=t("synced"));return true}).catch(()=>false);
}
function row(e){const c=calc();return[e.date,e.type=="ot"?"overtime":e.type=="ded"?"deduction":"leave",e.hours||"",e.mult||"",e.days||"",e.count||"",+val(e,c).toFixed(2),e.id]}
$("add").onclick=()=>{
  const date=$("date").value;if(!date){$("msg").textContent=t("nodate");return}
  const e={id:Date.now().toString(36),date,type};
  if(type=="ot"){e.hours=+$("f_h").value;e.mult=+$("f_m").value;if(!e.hours){$("msg").textContent=t("nohrs");return}}
  if(type=="ded"){e.days=+$("f_d").value;e.count=+$("f_c").value||1}
  S.entries.push(e);save();render();$("msg").textContent=t("added");
  if(S.url)post([row(e)]);
};
$("sync").onclick=()=>post(S.entries.map(row),{replace:true});
$("pull").onclick=()=>{
  if(!S.url){$("msg2").textContent=t("nourl");return}
  fetch(S.url).then(r=>r.json()).then(d=>{
    const num=x=>+String(x).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[٫,]/g,".");
    const have=new Set(S.entries.map(e=>e.id));
    (d.rows||[]).forEach(r=>{
      const id=String(r[7]||"");if(!id||have.has(id))return;
      const k=r[1]=="overtime"?"ot":r[1]=="deduction"?"ded":"lv";
      const e={id,date:String(r[0]),type:k};
      if(k=="ot"){e.hours=num(r[2]);e.mult=num(r[3])}
      if(k=="ded"){e.days=num(r[4]);e.count=num(r[5])||1}
      S.entries.push(e);
    });
    save();render();$("msg2").textContent=t("pulled");
  }).catch(()=>{$("msg2").textContent=t("pullerr")});
};
$("lang").onclick=()=>{S.lang=S.lang=="ar"?"en":"ar";save();render()};
function applyTheme(){document.documentElement.dataset.theme=S.theme=="dark"?"dark":"light";$("thL").classList.toggle("on",S.theme!="dark");$("thD").classList.toggle("on",S.theme=="dark")}
$("thL").onclick=()=>{S.theme="light";save();applyTheme()};
$("thD").onclick=()=>{S.theme="dark";save();applyTheme()};
[["salary","salary"],["fixb","fixb"],["dpm","dpm"],["hpd","hpd"],["bal","bal"],["sd","sd"]].forEach(([i,k])=>$(i).oninput=()=>{S[k]=$(i).value===""?"":+$(i).value;save();render2()});
function render2(){const a=document.activeElement.id;render();if(a){const el=$(a);if(el){el.focus()}}}
$("bonus").oninput=()=>{S.bonuses[$("month").value]=$("bonus").value===""?0:+$("bonus").value;save();render2()};
$("nArc").onclick=()=>{page="arc";render()};$("nMain").onclick=()=>{page="main";render()};$("nSet").onclick=()=>{page="set";render()};
$("url").oninput=()=>{S.url=$("url").value.trim();save()};
function confirmBtn(id,fn){let w=false,o;$(id).onclick=()=>{if(!w){w=true;o=$(id).textContent;$(id).textContent=t("sure");setTimeout(()=>{w=false;$(id).textContent=o},3000)}else{w=false;fn();save();render()}}}
confirmBtn("clr",()=>{const p=periodOf($("month").value);S.entries=S.entries.filter(e=>!(e.type!="lv"&&inP(e,p)))});
confirmBtn("clrl",()=>{S.entries=S.entries.filter(e=>e.type!="lv")});
applyTheme();render();
</script>
</body>
</html>
